aid: numbers-api
name: Numbers API
description: >
  Free REST API providing interesting mathematical facts, trivia, dates, and
  year facts about numbers for educational and fun applications. Returns short,
  readable facts about any number or date across four categories: trivia,
  mathematical properties, notable years, and day-of-year historical events.
  No authentication or API key required.
